name: expense_tracker
description: How MUCH? — A calm and confident expense tracker
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  fl_chart: ^0.68.0
  table_calendar: ^3.1.2
  lottie: ^3.1.2
  audioplayers: ^6.1.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  provider: ^6.1.2
  csv: ^6.0.0
  google_fonts: ^6.2.1
  flutter_colorpicker: ^1.1.0
  intl: ^0.19.0
  path_provider: ^2.1.3
  share_plus: ^9.0.0
  flutter_animate: ^4.5.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.9
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "assets/app_icon.png"
  adaptive_icon_foreground: "assets/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/lottie/
    - assets/sounds/
    - assets/app_icon.png
